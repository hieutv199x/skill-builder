# Framework / version compatibility — always verify against the target repo.
version: "1.1.0"

matrices:
  de-spring-boot-development:
    java: ">=17"
    spring-boot: ">=3.0 <4.0"
  de-angular-development:
    node: ">=18"
    angular: ">=15 <20"
  de-react-development:
    node: ">=18"
    react: ">=18"
  de-fastapi-development:
    python: ">=3.10"
    fastapi: ">=0.100"
  de-django-development:
    python: ">=3.10"
    django: ">=4.2"
  de-nestjs-development:
    node: ">=18"
    nestjs: ">=10"
  de-aspnet-core-development:
    dotnet: ">=8"
  de-android-development:
    kotlin: ">=1.9"
    min-sdk: "detect-from-gradle"
  de-swiftui-development:
    swift: ">=5.9"
  de-go-development:
    go: ">=1.21"
  de-flutter-development:
    dart: "detect-from-pubspec"
  de-backbase-service-development:
    extends: de-spring-boot-development
    backbase-sdk: "detect-from-bom"
  de-backbase-angular-development:
    extends: de-angular-development
    backbase-frontend: "detect-from-package-json"
